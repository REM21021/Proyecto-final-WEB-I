<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Estilos generales del encabezado y la barra */
header {
  background-color: #2c3e50;
  color: #fff;
  font-family: Arial, sans-serif;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
}

.logo {
  font-size: 1.5rem;
  font-weight: bold;
}

/* Lista principal de navegación */
.nav-links {
  list-style: none;
  display: flex;
  gap: 20px;
  margin: 0;
  padding: 0;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  padding: 0.5rem 1rem;
  display: block;
  transition: background 0.3s;
}

.nav-links a:hover {
  background-color: #34495e;
  border-radius: 4px;
}

/* --- ESTILOS DEL MENÚ DESPLEGABLE --- */

.dropdown {
  position: relative; /* Clave para posicionar el submenú en relación a este elemento */
}

/* Ocultar el submenú por defecto */
.dropdown-content {
  display: none;
  position: absolute;
  top: 100%; /* Lo sitúa justo debajo del elemento principal */
  left: 0;
  background-color: #34495e;
  min-width: 160px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  list-style: none;
  padding: 0;
  z-index: 10;
  border-radius: 4px;
}

/* Estilos de los enlaces internos del submenú */
.dropdown-content li a {
  padding: 10px 15px;
  white-space: nowrap;
}

.dropdown-content li a:hover {
  background-color: #1abc9c;
}

/* Mostrar el submenú al pasar el cursor sobre el elemento .dropdown */
.dropdown:hover .dropdown-content {
  display: block;
}
.dropdown {
  position: relative;
}

/* Botón principal */
.nav-links .dropbtn {
  /* Añadimos un borde base a la opción principal */
  border: 1px solid transparent; 
  transition: all 0.2s ease;
}

/* Al pasar el cursor, unificamos el borde superior, izquierdo y derecho del botón */
.dropdown:hover .dropbtn {
  background-color: #34495e;
  border-color: #1abc9c; /* Color del borde unificado */
  border-bottom-color: transparent; /* Hacemos transparente el borde inferior para que "conecte" con el menú */
  border-radius: 4px 4px 0 0; /* Redondeamos solo las esquinas superiores */
}

/* Contenedor del submenú */
.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background-color: #34495e;
  min-width: 160px;
  list-style: none;
  padding: 0;
  z-index: 10;
  
  /* El borde coincide con el color del botón para que se vea continuo */
  border: 1px solid #1abc9c;
  border-top: none; /* Quitamos el borde superior para que se funda con el botón */
  border-radius: 0 0 4px 4px; /* Redondeamos solo las esquinas inferiores */
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
}

/* Mostrar el submenú y mantener la conexión visual al hacer hover */
.dropdown:hover .dropdown-content {
  display: block;
}

/* Estilos de los elementos internos del submenú */
.dropdown-content li a {
  padding: 10px 15px;
  white-space: nowrap;
}

.dropdown-content li a:hover {
  background-color: #1abc9c;
  color: #fff;
}
    </style>
</head>
<body>
    <header>
  <nav class="navbar">
    <div class="logo">MiWeb</div>
    <ul class="nav-links">
      <li><a href="#">Inicio</a></li>
      
      <!-- Menú desplegable -->
      <li class="dropdown">
        <a href="#" class="dropbtn">Servicios ▾</a>
        <ul class="dropdown-content">
          <li><a href="#">Diseño Web</a></li>
          <li><a href="#">Desarrollo</a></li>
          <li><a href="#">SEO</a></li>
        </ul>
      </li>

      <li><a href="#">Acerca de</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </nav>
</header>
</body>
</html>
