<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Contenedor general */
.acordeon-menu {
  width: 250px;
  border: 1px solid #ccc;
  border-radius: 6px;
  overflow: hidden;
  font-family: sans-serif;
}

/* Estilo de cada elemento del acordeón */
.acordeon-item {
  border-bottom: 1px solid #ddd;
}

.acordeon-item:last-child {
  border-bottom: none;
}

/* Cabecera (lo que se ve y se hace clic) */
.acordeon-header {
  background-color: #f4f4f4;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: bold;
  list-style: none; /* Oculta la flecha por defecto en algunos navegadores */
  user-select: none;
  transition: background-color 0.2s;
}

.acordeon-header::-webkit-details-marker {
  display: none; /* Oculta flecha en Chrome/Safari */
}

.acordeon-header:hover {
  background-color: #eaeaea;
}

/* Lista del submenú desplegable */
.acordeon-content {
  list-style: none;
  margin: 0;
  padding: 0;
  background-color: #fff;
}

.acordeon-content li a {
  display: block;
  padding: 10px 20px;
  color: #333;
  text-decoration: none;
  border-top: 1px solid #f0f0f0;
  transition: background-color 0.2s;
}

.acordeon-content li a:hover {
  background-color: #f8f8f8;
  color: #007bff;
}

    </style>
</head>
<body>
    <div class="acordeon-menu">
  <!-- Ítem 1 -->
  <details class="acordeon-item">
    <summary class="acordeon-header">Principal 1</summary>
    <ul class="acordeon-content">
      <li><a href="#">Submenú 1.1</a></li>
      <li><a href="#">Submenú 1.2</a></li>
      <li><a href="#">Submenú 1.3</a></li>
    </ul>
  </details>

  <!-- Ítem 2 -->
  <details class="acordeon-item">
    <summary class="acordeon-header">Principal 2</summary>
    <ul class="acordeon-content">
      <li><a href="#">Submenú 2.1</a></li>
      <li><a href="#">Submenú 2.2</a></li>
    </ul>
  </details>

  <!-- Ítem 3 -->
  <details class="acordeon-item">
    <summary class="acordeon-header">Principal 3</summary>
    <ul class="acordeon-content">
      <li><a href="#">Submenú 3.1</a></li>
    </ul>
  </details>
</div>

</body>
</html>
