    <style>
        * {

        header {

            display: flex;
            flex-direction: column;
            align-content: space-between;
            margin-left: 20px;
            font-size: 25px;
        }

        .imagen {

            border-bottom-right-radius: 50px;
        }

        .frase {
            font-size: 67px;
        }

        .presentacion_p {
            width: 670px;
        }

        main a {
            font-size: 25px;
            text-decoration: none;
            color: var(--Texto-Principal);
            background: var(--Superficies);
            padding: 15px;
            border-radius: 15px;
        }

        main a:hover {
            background-color: var(--Fondo-Base);
        }

</head>
